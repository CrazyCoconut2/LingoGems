<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LingoGems</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="description" content="Collect languages and keep them on this device." />
    <meta name="theme-color" content="#0b0d1e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LingoGems" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0d1e;
        color: #9aa3c2;
      }

      #lg-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d1e;
      }

      #lg-boot-splash img {
        width: 7.5rem;
        height: 7.5rem;
        animation: lg-boot-pulse 1.4s ease-in-out infinite;
      }

      @keyframes lg-boot-pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #lg-boot-splash img {
          animation: none;
        }
      }

      #lg-version {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        margin: 0;
        padding: 0.12rem 0.75rem calc(0.12rem + env(safe-area-inset-bottom));
        color: #9499b3;
        font: 0.68rem/1.2 system-ui, sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="lg-boot-splash" role="status" aria-live="polite" aria-label="Loading LingoGems">
      <img src="icons/icon-192x192.png" alt="" aria-hidden="true" />
      <p id="lg-version">v1.0.361</p>
    </div>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
